name: Android build
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md', 'store/**', 'privacy.html', 'support.html']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Restore upload keystore (only if secrets are set)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        if: env.KS != ''
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks" && echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build test APK and Play Store bundle
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with: { name: underline-android-test-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: underline-play-store-bundle, path: android/app/build/outputs/bundle/release/*.aab }
