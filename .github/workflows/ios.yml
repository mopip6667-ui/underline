name: iOS build
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md', 'store/**', 'privacy.html', 'support.html']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (needs the Apple secrets)'
        type: boolean
        default: true
jobs:
  build:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Use the newest stable Xcode 26+ (Apple requires the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i -E 'beta|release_candidate|_rc' | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No stable Xcode 26+ on this runner. Available:"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Compile check (simulator, no signing)
        if: github.event_name == 'push' || env.ASC_KEY_ID == ''
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Archive and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.upload && env.ASC_KEY_ID != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # accept the .p8 file's text as-is, or base64 of it
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"; else printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"; fi
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/EERA.xcarchive" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive | tail -20
          sed "s/TEAM_ID_HERE/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/EERA.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -20
