name: Voice samples
on:
  workflow_dispatch:
    inputs:
      parts:
        default: 'edge kokoro chatter'
permissions: { contents: write }
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts kokoro-onnx soundfile
      - run: python tools/voice_samples.py ${{ inputs.parts }}
      - name: Kokoro
        if: contains(inputs.parts, 'kokoro')
        continue-on-error: true
        run: |
          mkdir -p model; B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL -o model/kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx; curl -sL -o model/voices-v1.0.bin $B/voices-v1.0.bin
          python tools/voice_samples.py kokoro
      - name: Chatterbox
        if: contains(inputs.parts, 'chatter')
        continue-on-error: true
        timeout-minutes: 30
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
          python tools/voice_samples.py chatter
      - run: |
          rm -rf model; ls -la store/voice-samples
          git config user.name underline-bot; git config user.email underline-bot@users.noreply.github.com
          git add store/voice-samples; git commit -m "Voice samples" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break || sleep 5; done
