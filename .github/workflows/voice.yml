name: Narration (Reels voice)
# Renders the neural-voice audio for Reels with Kokoro (free). Runs when books are added/changed, or by hand.
on:
  push:
    branches: [main]
    paths: ['data/books-*.json', 'data/index.json', 'tools/voice.py']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install kokoro-onnx soundfile numpy
      - name: Cache voice model
        id: model
        uses: actions/cache@v4
        with:
          path: model
          key: kokoro-v1.0-int8
      - name: Download voice model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p model
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL --retry 3 -o model/kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx
          curl -sL --retry 3 -o model/voices-v1.0.bin $B/voices-v1.0.bin
          ls -la model
      - name: Render
        run: python tools/voice.py --model-dir model --budget 300
      - name: Commit audio
        run: |
          git config user.name "underline-bot"; git config user.email "underline-bot@users.noreply.github.com"
          git add data/audio
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Narration: render new Reels audio"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break || sleep 5; done
      - name: Ask Pages to rebuild
        run: gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null 2>&1 || true
        env:
          GH_TOKEN: ${{ github.token }}
